<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education Management System</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
      (function(){
          emailjs.init("a0mKeGc0TNpxctj_5");
      })();
    </script>
    <script type="module" crossorigin src="/education/assets/index-DxZhcXxi.js"></script>
    <link rel="stylesheet" crossorigin href="/education/assets/index-CmYXOwxV.css">
    <style>
      .success-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 9999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .success-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -45%);
        background: white;
        width: 90%;
        max-width: 400px;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        z-index: 10000;
        display: none;
        text-align: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .success-modal.show {
        display: block;
        opacity: 1;
        transform: translate(-50%, -50%);
      }
      .success-overlay.show {
        display: block;
        opacity: 1;
      }
      .icon-circle {
        width: 80px;
        height: 80px;
        background: #d4edda;
        color: #28a745;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin: 0 auto 25px;
        animation: scaleIn 0.5s ease-out 0.2s both;
      }
      @keyframes scaleIn {
        from { transform: scale(0); }
        to { transform: scale(1); }
      }
      .success-modal h3 {
        color: #2c3e50;
        font-weight: 700;
        margin-bottom: 15px;
        font-size: 24px;
      }
      .success-modal p {
        color: #7f8c8d;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .close-btn {
        background: #28a745;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      }
      .close-btn:hover {
        background: #218838;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="success-overlay" class="success-overlay"></div>
    <div id="success-modal" class="success-modal">
      <div class="icon-circle">✓</div>
      <h3>Message Sent!</h3>
      <p>Thank you for reaching out. Our team has received your inquiry and will get back to you shortly.</p>
      <button class="close-btn" onclick="closeSuccessModal()">Great, Thanks!</button>
    </div>
    <script>
      function closeSuccessModal() {
        const modal = document.getElementById('success-modal');
        const overlay = document.getElementById('success-overlay');
        modal.classList.remove('show');
        overlay.classList.remove('show');
        setTimeout(() => {
          modal.style.display = 'none';
          overlay.style.display = 'none';
        }, 400);
      }
      function showSuccessModal() {
        const modal = document.getElementById('success-modal');
        const overlay = document.getElementById('success-overlay');
        modal.style.display = 'block';
        overlay.style.display = 'block';
        setTimeout(() => {
          modal.classList.add('show');
          overlay.classList.add('show');
        }, 10);
      }
    </script>
  </body>
</html>
