<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education Management System</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
      (function(){
          emailjs.init("a0mKeGc0TNpxctj_5");
      })();
    </script>
    <script type="module" crossorigin src="/education/assets/index-DxZhcXxi.js"></script>
    <link rel="stylesheet" crossorigin href="/education/assets/index-CmYXOwxV.css">
    <style>
      .success-toast {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        color: #333;
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        z-index: 10000;
        font-weight: bold;
        display: none;
        text-align: center;
        border-top: 5px solid #28a745;
      }
      .success-toast h4 { color: #28a745; margin-bottom: 10px; }
      .success-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 9999;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="success-overlay" class="success-overlay"></div>
    <div id="success-toast" class="success-toast">
      <h4>✓ Success!</h4>
      <p>Your message has been sent successfully.<br>We will contact you shortly.</p>
      <button onclick="document.getElementById('success-toast').style.display='none';document.getElementById('success-overlay').style.display='none'" style="background:#28a745;color:white;border:none;padding:8px 20px;border-radius:5px;cursor:pointer;margin-top:10px">Close</button>
    </div>
  </body>
</html>
